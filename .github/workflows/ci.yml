name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
